name: Turn AWS on

on:
  workflow_dispatch:

concurrency:
  group: formpilot-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  start:
    name: Start the deployment
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Start the database and web tasks
        run: |
          set -euo pipefail
          DB="$(aws cloudformation describe-stack-resource \
            --stack-name formpilot-prod \
            --logical-resource-id Database \
            --query StackResourceDetail.PhysicalResourceId \
            --output text)"
          STATUS="$(aws rds describe-db-instances \
            --db-instance-identifier "$DB" \
            --query 'DBInstances[0].DBInstanceStatus' \
            --output text)"
          echo "Database $DB is $STATUS"
          if [ "$STATUS" = "stopped" ]; then
            aws rds start-db-instance --db-instance-identifier "$DB"
          fi
          aws rds wait db-instance-available --db-instance-identifier "$DB"

          aws cloudformation deploy \
            --stack-name formpilot-prod \
            --template-file infra/cloudformation.yml \
            --capabilities CAPABILITY_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides DesiredCount=2

          CLUSTER="$(aws cloudformation describe-stacks \
            --stack-name formpilot-prod \
            --query "Stacks[0].Outputs[?OutputKey=='ClusterName'].OutputValue" \
            --output text)"
          SERVICE="$(aws cloudformation describe-stacks \
            --stack-name formpilot-prod \
            --query "Stacks[0].Outputs[?OutputKey=='ServiceName'].OutputValue" \
            --output text)"
          aws ecs update-service \
            --cluster "$CLUSTER" \
            --service "$SERVICE" \
            --desired-count 2 \
            --force-new-deployment \
            --query 'service.serviceName' \
            --output text
          aws ecs wait services-stable --cluster "$CLUSTER" --service "$SERVICE"
          aws cloudformation describe-stacks \
            --stack-name formpilot-prod \
            --query "Stacks[0].Outputs[?OutputKey=='Url'].OutputValue" \
            --output text
