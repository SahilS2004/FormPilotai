<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FormPilot AI - Form Copilot</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <div class="panel-container">
    <!-- Header with Official Logo, Theme Switcher & Dashboard Link -->
    <header class="panel-header">
      <div class="logo-group">
        <img src="../brand/logo-mark.png" alt="FormPilot Logo" class="brand-icon">
        <div class="brand-text">
          <h2 class="brand-title">FormPilot</h2>
        </div>
      </div>
      <div class="header-actions">
        <button id="btn-manage-kb" class="btn-manage" title="Dashboard">
          <span>Dashboard</span>
        </button>
      </div>
    </header>

    <section class="tone-section">
      <label for="select-tone" class="label-tiny">Tone</label>
      <div class="tone-select-wrap">
        <select id="select-tone" class="tone-select">
          <option value="professional" selected>Professional</option>
          <option value="informative">Informative</option>
          <option value="requesting">Requesting</option>
          <option value="casual">Casual</option>
        </select>
      </div>
    </section>

    <section class="action-section">
      <div class="action-grid">
        <button id="btn-fill-form" class="btn-primary">
          <span>Fill form</span>
        </button>
      </div>
      <div id="fill-status" class="fill-status hidden"></div>
    </section>

    <section class="kb-section">
      <div class="section-title-row">
        <div class="flex-align gap-6">
          <h3>Documents</h3>
          <span id="active-docs-badge" class="badge">0</span>
        </div>
        <button id="btn-sync-kb" class="btn-sync" title="Sync">
          <span>Sync</span>
        </button>
      </div>
      <div id="doc-list" class="doc-list"></div>
    </section>

    <section class="snippet-section">
      <div id="snippet-body" class="snippet-body">
        <textarea id="input-snippet-text" placeholder="Add a note" rows="2" class="snippet-textarea"></textarea>
        <div class="snippet-actions">
          <button id="btn-save-snippet" class="btn-snippet-save">
            <span>Save note</span>
          </button>
          <span id="snippet-save-status" class="snippet-save-status hidden">
            <span>Saved</span>
          </span>
        </div>
      </div>
    </section>
  </div>

  <script type="module" src="../sidepanel.js"></script>
</body>
</html>
