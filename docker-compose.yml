services:
  # =========================================================================
  # 1. PostgreSQL Database Service
  # =========================================================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: formpilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: formpilot
      POSTGRES_PASSWORD: formpilot_secure_pass_2026
      POSTGRES_DB: formpilot_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U formpilot -d formpilot_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - formpilot-network

  # =========================================================================
  # 2. FormPilot AI Web Application (Next.js Dashboard & Context API)
  # =========================================================================
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: formpilot-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://formpilot:formpilot_secure_pass_2026@postgres:5432/formpilot_db
      S3_ENDPOINT: http://localstack:4566
      S3_BUCKET: formpilot-kb
      S3_ACCESS_KEY_ID: test
      S3_SECRET_ACCESS_KEY: test
      S3_FORCE_PATH_STYLE: "true"
      AWS_REGION: us-east-1
      GEMINI_MODEL: gemini-3.5-flash
      GEMINI_FALLBACK_MODEL: gemini-3.6-flash
      GEMINI_EMBEDDING_MODEL: gemini-embedding-2
      EMBEDDING_DIM: "768"
      NEXT_TELEMETRY_DISABLED: 1
      PORT: 3000
    env_file:
      - ./apps/web/.env.local
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
    networks:
      - formpilot-network

  # =========================================================================
  # 3. Local AWS stand-in. S3 is live here. EventBridge + Lambda are the
  #    production dispatcher; locally the Next.js server runs that loop.
  # =========================================================================
  localstack:
    image: localstack/localstack:3.8
    container_name: formpilot-localstack
    restart: unless-stopped
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - localstack_data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - formpilot-network

networks:
  formpilot-network:
    driver: bridge

volumes:
  pgdata:
    driver: local
  localstack_data:
    driver: local
